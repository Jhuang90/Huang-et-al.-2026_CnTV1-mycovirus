# Include housekeeping configuration file
<<include /path/to/circos/etc/housekeeping.conf>>

# Define karyotype file
karyotype = /path/to/data/karyotype.txt
chromosomes_display_default = yes
chromosomes_scale = /MT/:500

<ideogram>
    <spacing>
        default = 0.01r
    </spacing>
    radius           = 0.85r
    thickness        = 40p
    stroke_thickness = 1
    stroke_color     = black
    fill             = yes
    show_label       = yes
    label_font       = bold
    label_radius     = dims(ideogram,radius_outer) + 0.12r
    label_size       = 30p
    label_parallel   = yes
</ideogram>

<colors>
    <<include /path/to/circos/etc/colors.conf>>
</colors>

<fonts>
    <<include /path/to/circos/etc/fonts.conf>>
</fonts>

show_ticks          = yes
show_tick_labels    = yes

<ticks>
    radius           = 1r
    color            = black
    thickness        = 2p

    <tick>
        chromosomes_display_default = no
        chromosomes      = NRHc5010_Chr1;NRHc5010_Chr2;NRHc5010_Chr3;NRHc5010_Chr4;NRHc5010_Chr5;NRHc5010_Chr6;NRHc5010_Chr7;NRHc5010_Chr8;NRHc5010_Chr9;NRHc5010_Chr10;NRHc5010_Chr11;NRHc5010_Chr12;NRHc5010_Chr13;NRHc5010_Chr14
        spacing          = 500000
        size             = 10p
        show_label       = yes
        label_size       = 10p
        label_offset     = 10p
        label_multiplier = 1e-6
        format           = %.1f Mb
    </tick>

    <tick>
        chromosomes_display_default = yes
        chromosomes      = -NRHc5010_Chr1;-NRHc5010_Chr2;-NRHc5010_Chr3;-NRHc5010_Chr4;-NRHc5010_Chr5;-NRHc5010_Chr6;-NRHc5010_Chr7;-NRHc5010_Chr8;-NRHc5010_Chr9;-NRHc5010_Chr10;-NRHc5010_Chr11;-NRHc5010_Chr12;-NRHc5010_Chr13;-NRHc5010_Chr14
        spacing          = 5000
        size             = 10p
        show_label       = yes
        label_size       = 10p
        label_offset     = 5p
        label_multiplier = 1e-3
        format           = %.0f kb
    </tick>

</ticks>

<links>
    <link>
        file          = /path/to/data/NRHc5010_links2.txt
        radius        = 0.98r
        bezier_radius = 0.2r
        thickness     = 6
    </link>
</links>

<plots>
    <plot>
        type             = highlight
        file             = /path/to/data/NRHc5010_highlight_v2.txt
        r0               = 0.94r
        r1               = 0.98r
        stroke_thickness = 0
    </plot>

    <plot>
        type          = text
        file          = /path/to/data/NRHc5010_mt_annot_gene_only_v2.txt
        r0            = 1.01r
        r1            = 1.11r
        text_column   = 2
        label_size    = 20p
        label_font    = bold
        padding       = 0p
        color         = black
        show_links    = no
        orientation   = out
        label_snuggle = yes
    </plot>
</plots>

<image>
    dir          = ./output/
    file         = 5010_mtcircos_V2
    png          = yes
    svg          = yes
    radius       = 1050p
    background   = white
    image_size   = 2400x2400
</image>
